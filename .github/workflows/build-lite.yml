name: Build PlotSquaredLite
on:
  push:
    paths:
      - "Lite/**"
      - ".github/workflows/build-lite.yml"
    tags:
      - "lite-v*"
  pull_request:
    paths:
      - "Lite/**"
      - ".github/workflows/build-lite.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: ./gradlew -p Lite build
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: PlotSquaredLite
          path: Lite/build/libs/*.jar
      # 推送 lite-v* 標籤時，把 jar 發佈到 GitHub Releases
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/lite-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Lite/build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "PlotSquaredLite ${GITHUB_REF_NAME#lite-v}" \
            --notes-file Lite/RELEASE_NOTES.md \
            --prerelease
