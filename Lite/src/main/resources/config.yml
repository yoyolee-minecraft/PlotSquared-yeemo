  cannot-enter: "&c你被禁止進入這塊地皮"
  clearing: "&7正在清除地皮，請稍候..."
  cleared: "&a地皮已清除完成"
  deleting: "&7正在刪除地皮，請稍候..."
  deleted: "&a地皮已刪除"
  confirm: "&e請在 20 秒內輸入 &f/{label} confirm &e確認此操作"
  nothing-to-confirm: "&c沒有需要確認的操作"
  teleporting: "&7傳送中..."
  no-plots: "&c{player} 沒有任何地皮"
