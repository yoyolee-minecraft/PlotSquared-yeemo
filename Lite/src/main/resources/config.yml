    &f/{label} info &7查看地皮資訊
    &f/{label} list [玩家] &7列出地皮
    &f/{label} trust <玩家> &7加入信任者（隨時可建築）
    &f/{label} add <玩家> &7加入成員（擁有者在線時可建築）
    &f/{label} remove <玩家> &7從信任者／成員移除
    &f/{label} deny <玩家> &7禁止進入
    &f/{label} undeny <玩家> &7解除禁止
    &f/{label} sethome [reset] &7設定家園位置
    &f/{label} clear &7清除地皮（保留擁有權）
    &f/{label} delete &7刪除地皮並清除
    &f/{label} setowner <玩家> &7變更擁有者（管理員）
    &f/{label} reload &7重新載入設定（管理員）
