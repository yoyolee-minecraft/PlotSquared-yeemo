    &7擁有者：&f{owner}
    &7信任者：&f{trusted}
    &7成員：&f{members}
    &7禁止：&f{denied}
    &7合併：&f{merged}
  help: |-
    &6PlotSquaredLite 指令
    &f/{label} claim &7認領腳下的地皮
    &f/{label} auto &7自動認領一塊空地
    &f/{label} home [編號|玩家] [編號] &7回到自己的地皮
    &f/{label} visit <玩家> [編號] &7拜訪別人的地皮
