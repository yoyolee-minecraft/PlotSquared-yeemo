  plot-claimed: "&c這塊地皮已經有人認領了"
  not-owner: "&c你不是這塊地皮的擁有者"
  limit-reached: "&c你已達到地皮數量上限（{amount}）"
  claimed: "&a成功認領地皮 &f{id}"
  no-free-plot: "&c找不到可用的空地"
  player-not-found: "&c找不到玩家 &f{player}"
  already-added: "&c{player} 已經在名單中"
  not-added: "&c{player} 不在名單中"
  cannot-add-owner: "&c不能把擁有者加入名單"
  trusted: "&a已將 &f{player} &a設為信任者（隨時可建築）"
  member-added: "&a已將 &f{player} &a設為成員（擁有者在線時可建築）"
  denied: "&a已禁止 &f{player} &a進入這塊地皮"
  removed: "&a已將 &f{player} &a從名單移除"
  undenied: "&a已解除對 &f{player} &a的禁止"
