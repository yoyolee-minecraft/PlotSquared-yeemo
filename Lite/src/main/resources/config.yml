  home-reset: "&a已重設地皮家園位置"
  setowner: "&a已將地皮擁有者改為 &f{player}"
  reloaded: "&a設定已重新載入"
  invalid-id: "&c無效的地皮座標，格式為 x;z"
  build-denied: "&c你不能在這裡建築"
  build-height: "&c超出可建築的高度範圍"
  list-header: "&6{player} 的地皮（{amount}）："
