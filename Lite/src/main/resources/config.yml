# PlotSquaredLite 設定檔
#
# 這個插件直接讀寫 PlotSquared 的資料：
#   <data-folder>/config/worlds.yml   地皮世界設定
#   <data-folder>/config/storage.yml  資料庫設定（SQLite 或 MySQL）
#   <data-folder>/storage.db          SQLite 資料庫（預設）
# 因此可以直接取代 PlotSquared，也可以隨時換回去。

# PlotSquared 的資料夾，相對於伺服器根目錄。
# 若資料夾不存在會自動建立，並以 PlotSquared 的格式寫入新檔案。
data-folder: plugins/PlotSquared

limits:
  # 地皮上限是否跨世界計算（對應 PlotSquared settings.yml 的 limit.global）
  global: false
  # 檢查 plots.plot.<數字> 權限的最大數字（對應 limit.max-plots）
  max-plots: 127

clear:
  # 清除地皮時每 tick 最多改動的方塊數，數字越大清得越快但越吃效能
  blocks-per-tick: 40000

# 認領後是否自動傳送到地皮
teleport-on-claim: true

# 是否在地皮世界禁止玩家互相攻擊（擁有 plots.admin.pvp 的玩家不受限制）
disable-pvp: true

