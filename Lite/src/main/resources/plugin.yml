name: PlotSquaredLite
main: com.plotsquared.lite.PlotSquaredLite
version: "${version}"
api-version: "1.21"
load: STARTUP
description: "PlotSquared 輕量版：地皮生成、認領與權限控制，直接沿用 PlotSquared 的資料"
softdepend: [ WorldEdit, FastAsyncWorldEdit, AxiomPaper ]
loadbefore: [ Multiverse-Core, MultiWorld ]
commands:
  plots:
    description: 地皮指令
    aliases: [ p, plot, ps, plotsquared, p2, 2 ]
    permission: plots.use
    permission-message: "你沒有權限：plots.use"
# 權限節點與 PlotSquared 相同，原本的權限組設定可以直接沿用
permissions:
  plots.use:
    default: true
  plots.tp:
    default: op
  plots.list.player:
    default: op
  plots.trust.everyone:
    default: op
  plots.add.everyone:
    default: op
  plots.deny.everyone:
    default: op
  plots.admin.pvp:
    default: op
  plots.worldedit.bypass:
    default: op
  plots.worldedit.member:
    default: false
  plots.permpack.basic:
    default: false
    children:
      plots.use: true
      plots.info: true
      plots.claim: true
      plots.auto: true
      plots.home: true
      plots.clear: true
      plots.delete: true
      plots.list: true
      plots.visit: true
      plots.visit.owned: true
      plots.visit.shared: true
      plots.visit.other: true
      plots.set.home: true
      plots.add: true
      plots.trust: true
      plots.deny: true
      plots.remove: true
      plots.untrust: true
      plots.undeny: true
  plots.admin:
    default: op
    children:
      plots.admin.command.delete: true
      plots.admin.command.clear: true
      plots.admin.command.deny: true
      plots.admin.command.undeny: true
      plots.admin.command.trust: true
      plots.admin.command.add: true
      plots.admin.command.remove: true
      plots.admin.command.setowner: true
      plots.admin.command.sethome: true
      plots.admin.command.reload: true
      plots.admin.entry.denied: true
      plots.admin.destroy.unowned: true
      plots.admin.destroy.other: true
      plots.admin.destroy.road: true
      plots.admin.build.road: true
      plots.admin.build.unowned: true
      plots.admin.build.other: true
      plots.admin.build.heightlimit: true
      plots.admin.interact.road: true
      plots.admin.interact.unowned: true
      plots.admin.interact.other: true
      plots.admin.pvp: true
      plots.tp: true
      plots.list.player: true
      plots.trust.everyone: true
      plots.add.everyone: true
      plots.deny.everyone: true
